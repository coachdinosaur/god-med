<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1a14">
  <meta name="description" content="Daily scripture listening habit. Works offline.">
  <title>God Med – Daily Scripture</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <svg class="cross" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M43 8h14v24h25v14H57v46H43V46H18V32h25z" fill="currentColor"/>
    </svg>
    <div>
      <h1>God Med</h1>
      <p class="sub">Daily scripture · listen &amp; receive</p>
    </div>
    <div class="streak" id="streak" aria-live="polite">
      <span class="streak-num" id="streakNum">0</span>
      <span class="streak-lbl">day streak</span>
    </div>
  </header>

  <main>
    <section class="today" id="today" aria-labelledby="todayTitle">
      <div class="today-head">
        <div>
          <h2 id="todayTitle">Today</h2>
          <p class="date" id="todayDate"></p>
        </div>
        <div class="daycheck" id="dayCheck" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="12" id="progress">
        <div class="bar" id="bar"></div>
      </div>
      <p class="count" id="count"></p>
      <p class="done-msg" id="doneMsg" hidden>✝ Done for today. Well done!</p>
      <div class="controls">
        <button class="btn primary" id="playAll" type="button">▶ Play all</button>
        <label class="speed">Speed
          <select id="speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
          </select>
        </label>
      </div>
    </section>

    <section aria-labelledby="versesTitle">
      <h2 id="versesTitle" class="section-title">Verses</h2>
      <ol class="verses" id="verses"></ol>
    </section>

    <section class="cal" aria-labelledby="calTitle">
      <div class="cal-head">
        <button class="btn icon" id="prevMonth" type="button" aria-label="Previous month">‹</button>
        <h2 id="calTitle" class="section-title"></h2>
        <button class="btn icon" id="nextMonth" type="button" aria-label="Next month">›</button>
      </div>
      <div class="cal-grid dow" aria-hidden="true">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <p class="best" id="best"></p>
    </section>
  </main>

  <audio id="player" preload="auto"></audio>
  <script type="module" src="app.js"></script>
</body>
</html>
